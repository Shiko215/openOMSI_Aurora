name: Feature Request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe your idea below.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Is your request related to something that's currently missing or annoying?
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe the feature or change you're proposing.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you've thought about.
    validations:
      required: false