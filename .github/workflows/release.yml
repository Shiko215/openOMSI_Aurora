# Builds openOMSI for Windows, macOS, Linux and Android (plus the dedicated server) on every push to
# main and publishes them as the release v<MAJOR.MINOR.COMMIT>; see docs/VERSIONING.md.
# Pull requests run the same builds without publishing.
name: Release

on:
  push:
    branches: [main, shiko]
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: echo "version=$(sh scripts/version.sh)" >> "$GITHUB_OUTPUT"
      - run: echo "### openOMSI ${{ steps.v.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      OPENOMSI_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: cmd
        run: scripts\build-windows.cmd
      - name: Package
        shell: pwsh
        run: |
          $name = "openOMSI-$env:OPENOMSI_VERSION-windows-x64"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item README.md, LICENSE dist/windows/
          Compress-Archive -Path dist/windows/* -DestinationPath "out/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*.zip

  macos:
    needs: version
    runs-on: macos-latest
    env:
      OPENOMSI_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: scripts/build-macos.sh
      - name: Package
        run: |
          mkdir -p out
          cp README.md LICENSE dist/macos/
          cd dist/macos && ditto -c -k --sequesterRsrc . "../../out/openOMSI-$OPENOMSI_VERSION-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*.zip

  linux:
    needs: version
    runs-on: ubuntu-22.04
    env:
      OPENOMSI_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y build-essential pkg-config libasound2-dev \
              libudev-dev libgtk-3-dev libxkbcommon-dev libwayland-dev libssl-dev zip && break
            sleep 20
          done
      - name: Build the game
        run: scripts/build-linux.sh
      - name: Build the server
        run: scripts/build-server.sh
      - name: Validate shaders
        run: cargo test --locked --release -p omsi-render shaders_validate_and_match_the_uniforms
      - name: Test material selection
        run: cargo test --locked --release -p omsi-app freetex_overrides_a_fixed_texchanges_entry
      - name: Package
        run: |
          mkdir -p out
          cp README.md LICENSE dist/linux/
          cp LICENSE dist/server/
          (cd dist/linux && zip -qr "../../out/openOMSI-$OPENOMSI_VERSION-linux-x64.zip" .)
          (cd dist/server && zip -qr "../../out/openOMSI-$OPENOMSI_VERSION-server-linux-x64.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*.zip

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      OPENOMSI_VERSION: ${{ needs.version.outputs.version }}
      # the signing key (base64 of a keystore, alias openomsi, password android); without
      # it every build is signed with a new key and does not install over the last one
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Android SDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Build
        run: scripts/build-android.sh
      - name: Package
        run: |
          mkdir -p out
          cp "dist/android/openOMSI-$OPENOMSI_VERSION.apk" "out/openOMSI-$OPENOMSI_VERSION-android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, windows, macos, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish v${{ needs.version.outputs.version }}
        run: |
          ls -l out
          cat > notes.md <<NOTES
          **openOMSI $VERSION** - built from ${GITHUB_SHA::7}.

          > **Early release, expect bugs.** openOMSI needs an original OMSI 2 installation to run; it contains no game content.

          | Platform | Download |
          | --- | --- |
          | Windows x64 | \`openOMSI-$VERSION-windows-x64.zip\` |
          | macOS (Apple silicon) | \`openOMSI-$VERSION-macos-arm64.zip\` |
          | Linux x64 | \`openOMSI-$VERSION-linux-x64.zip\` |
          | Android (arm64, 8.0+) | \`openOMSI-$VERSION-android-arm64.apk\` |
          | Dedicated server | \`openOMSI-$VERSION-server-linux-x64.zip\` |
          NOTES
          git tag -f "v$VERSION" "$GITHUB_SHA"
          git push -f origin "v$VERSION"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            # the same version built again (main was rewritten and pushed once more): the
            # release stays, with this build's files and notes
            gh release upload "v$VERSION" out/*.zip out/*.apk --clobber
            gh release edit "v$VERSION" --title "openOMSI $VERSION" --notes-file notes.md
          else
            gh release create "v$VERSION" out/*.zip out/*.apk \
              --verify-tag \
              --title "openOMSI $VERSION" \
              --notes-file notes.md \
              --generate-notes
          fi
