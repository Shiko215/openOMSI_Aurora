"Once the game runs, the Sessions page shows the session code with a copy button; your friend pastes it into Join. It works at home and over the internet - no VPN needed.":
  ru: "Когда игра запущена, на странице «Сессии» виден код сессии с кнопкой копирования; друг вставляет его в «Присоединиться». Работает дома и через интернет - VPN не нужен."
  de: "Sobald das Spiel läuft, zeigt die Seite Sitzungen den Code mit Kopier-Knopf; dein Freund fügt ihn bei Beitreten ein. Funktioniert zu Hause und über das Internet - ohne VPN."
  fr: "Une fois le jeu lancé, la page Sessions affiche le code avec un bouton copier ; votre ami le colle dans Rejoindre. Fonctionne à la maison et sur Internet - sans VPN."
  zh-tw: "遊戲啟動後，「遊戲工作階段」頁面會顯示可複製的代碼。朋友在「加入」貼上即可，在家或透過互聯網均可使用，毋須 VPN。"
  zh-cn: "游戏启动后，“游戏会话”页面会显示可复制的代码。好友在“加入”中粘贴即可，局域网或互联网均可使用，无需 VPN。"
  ja: "ゲーム開始後、セッション画面にコピー可能なコードが表示されます。友達は「参加」に貼り付けるだけです。自宅でもインターネット経由でも利用でき、VPNは不要です。"
  ko: "게임 실행 후 세션 화면에 복사 가능한 코드가 표시됩니다. 친구가 참가 화면에 붙여 넣으면 됩니다. 집이나 인터넷 어디서든 VPN 없이 작동합니다."
  th: "เมื่อเกมเริ่มแล้ว หน้าเซสชันจะแสดงรหัสพร้อมปุ่มคัดลอก ให้เพื่อนวางรหัสในหน้าเข้าร่วม ใช้งานได้ทั้งในบ้านและผ่านอินเทอร์เน็ตโดยไม่ต้องใช้ VPN"
  vi: "Khi trò chơi chạy, trang Phiên chơi hiển thị mã cùng nút sao chép. Bạn bè dán mã vào Tham gia. Hoạt động ở nhà hoặc qua Internet mà không cần VPN."
  id: "Setelah game berjalan, halaman Sesi menampilkan kode yang dapat disalin. Teman Anda menempelkannya di Gabung. Bisa melalui jaringan rumah maupun internet tanpa VPN."
  ms: "Apabila permainan bermula, halaman Sesi menunjukkan kod yang boleh disalin. Rakan anda menampalnya pada Sertai. Berfungsi di rumah atau melalui internet tanpa VPN."
  tl: "Kapag tumatakbo na ang laro, ipapakita ng Sessions ang code na puwedeng kopyahin. I-paste iyon ng kaibigan sa Join. Gumagana sa bahay o internet nang walang VPN."
