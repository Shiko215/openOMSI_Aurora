"A session needs the original OMSI 2: choose its folder under Setup first.":
  ru: "Для игры нужна оригинальная OMSI 2: сначала выберите её папку в «Установке»."
  de: "Eine Sitzung braucht das originale OMSI 2: wähle zuerst seinen Ordner unter Einrichtung."
  fr: "Une session a besoin de l'OMSI 2 original : choisissez d'abord son dossier dans Installation."
  zh-tw: "遊戲工作階段需要原版 OMSI 2。請先在「初始設定」選擇其資料夾。"
  zh-cn: "游戏会话需要原版 OMSI 2。请先在“初始设置”中选择其文件夹。"
  ja: "セッションには元の OMSI 2 が必要です。先に初期設定でフォルダーを選択してください。"
  ko: "세션에는 원본 OMSI 2가 필요합니다. 먼저 초기 설정에서 폴더를 선택하세요."
  th: "ต้องมี OMSI 2 ต้นฉบับ เลือกโฟลเดอร์ในหน้าตั้งค่าเริ่มต้นก่อน"
  vi: "Phiên chơi cần OMSI 2 gốc. Hãy chọn thư mục trong Thiết lập trước."
  id: "Sesi membutuhkan OMSI 2 asli. Pilih foldernya di Penyiapan terlebih dahulu."
  ms: "Sesi memerlukan OMSI 2 asal. Pilih foldernya dalam Persediaan dahulu."
  tl: "Kailangan ang orihinal na OMSI 2. Piliin muna ang folder nito sa Setup."
