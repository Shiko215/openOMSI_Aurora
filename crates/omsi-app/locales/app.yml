"Pick a line first. As in OMSI, the start time and date then say where in the tour the bus is: the trip under way, or the next to leave.":
  ru: "Сначала выберите линию. Как в OMSI, время и дата старта определяют, где в выходе находится автобус: текущий рейс или следующий."
  de: "Wähle zuerst eine Linie. Wie in OMSI bestimmen Startzeit und Datum, wo im Umlauf der Bus ist: die laufende Fahrt oder die nächste."
  fr: "Choisissez d'abord une ligne. Comme dans OMSI, l'heure et la date de départ indiquent où en est le bus dans son service : le trajet en cours ou le suivant."
  zh-tw: "請先選擇路線。與 OMSI 一樣，開始日期及時間會決定巴士在更次中的位置，是正在行駛的班次，或下一班準備出發的車。"
  zh-cn: "请先选择线路。与 OMSI 一样，开始日期和时间决定车辆在班次中的位置，即正在进行的行程或下一班待发车次。"
  ja: "最初に系統を選んでください。OMSI と同様に、開始日時から運行ダイヤ上の現在の便または次の出発便が決まります。"
  ko: "먼저 노선을 선택하세요. OMSI와 같이 시작 날짜와 시간이 현재 운행 중인 차량 또는 다음 출발 차량을 결정합니다."
  th: "เลือกสายรถก่อน เช่นเดียวกับ OMSI วันและเวลาเริ่มต้นจะกำหนดว่ารถอยู่ในเที่ยวที่กำลังวิ่งหรือเที่ยวถัดไป"
  vi: "Hãy chọn tuyến trước. Như OMSI, ngày giờ bắt đầu quyết định xe đang chạy chuyến nào hoặc chuẩn bị rời bến."
  id: "Pilih jalur terlebih dahulu. Seperti OMSI, waktu dan tanggal mulai menentukan perjalanan yang sedang berlangsung atau yang berikutnya."
  ms: "Pilih laluan dahulu. Seperti OMSI, masa dan tarikh mula menentukan perjalanan yang sedang berlangsung atau perjalanan berikutnya."
  tl: "Pumili muna ng linya. Tulad sa OMSI, ang petsa at oras ang magtatakda kung nasa kasalukuyan o susunod na biyahe ang bus."
