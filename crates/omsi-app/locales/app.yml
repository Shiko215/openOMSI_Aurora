"The original OMSI 2 was not found automatically: choose its folder (the one with OMSI, maps and Vehicles) and press Save.":
  ru: "Оригинальная OMSI 2 не найдена автоматически: выберите её папку (где OMSI, maps и Vehicles) и нажмите «Сохранить»."
  de: "Das originale OMSI 2 wurde nicht automatisch gefunden: wähle seinen Ordner (mit OMSI, maps und Vehicles) und drücke Speichern."
  fr: "L'OMSI 2 original n'a pas été trouvé automatiquement : choisissez son dossier (celui avec OMSI, maps et Vehicles) et appuyez sur Enregistrer."
  zh-tw: "未能自動找到原版 OMSI 2：請選擇包含 OMSI、maps 及 Vehicles 的資料夾，再按「儲存」。"
  zh-cn: "未能自动找到原版 OMSI 2：请选择包含 OMSI、maps 和 Vehicles 的文件夹，然后点击“保存”。"
  ja: "元の OMSI 2 を自動検出できませんでした。OMSI、maps、Vehicles があるフォルダーを選択し、「保存」を押してください。"
  ko: "원본 OMSI 2를 자동으로 찾을 수 없습니다. OMSI, maps, Vehicles가 있는 폴더를 선택하고 저장하세요."
  th: "ไม่พบ OMSI 2 ต้นฉบับ เลือกโฟลเดอร์ที่มี OMSI, maps และ Vehicles แล้วกดบันทึก"
  vi: "Không tìm thấy OMSI 2 gốc. Chọn thư mục chứa OMSI, maps và Vehicles rồi nhấn Lưu."
  id: "OMSI 2 asli tidak ditemukan. Pilih folder yang berisi OMSI, maps, dan Vehicles, lalu tekan Simpan."
  ms: "OMSI 2 asal tidak ditemui. Pilih folder yang mengandungi OMSI, maps dan Vehicles, kemudian tekan Simpan."
  tl: "Hindi nakita ang orihinal na OMSI 2. Piliin ang folder na may OMSI, maps at Vehicles, saka pindutin ang Save."
"The driver whose personnel file the game writes: hours, kilometres, punctuality, tickets.":
  ru: "Водитель, в личное дело которого игра пишет: часы, километры, пунктуальность, билеты."
  de: "Der Fahrer, dessen Personalakte das Spiel führt: Stunden, Kilometer, Pünktlichkeit, Fahrscheine."
  fr: "Le conducteur dont le jeu tient le dossier : heures, kilomètres, ponctualité, billets."
  zh-tw: "遊戲會為這名司機記錄駕駛時數、里程、準時率及售票數據。"
  zh-cn: "游戏会为该驾驶员记录驾驶时长、里程、准点率和售票数据。"
  ja: "ゲームはこのドライバーの運転時間、走行距離、定時性、乗車券販売を記録します。"
  ko: "게임이 이 운전자의 운전 시간, 거리, 정시성, 승차권 판매를 기록합니다."
  th: "เกมจะบันทึกชั่วโมงขับรถ ระยะทาง ความตรงเวลา และการขายตั๋วของคนขับนี้"
  vi: "Trò chơi ghi lại số giờ lái, quãng đường, độ đúng giờ và vé đã bán của tài xế này."
  id: "Game mencatat jam, kilometer, ketepatan waktu, dan tiket pengemudi ini."
  ms: "Permainan merekod jam, kilometer, ketepatan masa dan tiket pemandu ini."
  tl: "Itinatala ng laro ang oras, kilometro, pagiging nasa oras at tickets ng driver na ito."
